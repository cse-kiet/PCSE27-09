<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datasets Explorer | Crime Analytics AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{url_for('static',filename='stylesheets/modern_theme.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='stylesheets/table.css')}}">

    <script src="{{url_for('static',filename='javascript/linearregression.js')}}"></script>
    <script src="{{url_for('static',filename='javascript/table.js')}}"></script>
</head>

<body onload="linearr()">
    <!-- Navigation Bar -->
    <nav class="main">
        <label class="logo" onclick="window.location.href='{{url_for('index')}}'">
            <i class="fa-solid fa-shield-halved text-purple-400"></i>
            CRIME ANALYTICS AI
        </label>
        <ul>
            <li><a href="{{url_for('index')}}"><i class="fa-solid fa-house mr-1"></i> Home</a></li>
            <li><a href="{{url_for('about')}}"><i class="fa-solid fa-circle-info mr-1"></i> About</a></li>
            <li><a href="{{url_for('feedback')}}"><i class="fa-solid fa-comment-dots mr-1"></i> Feedback</a></li>
        </ul>
    </nav>
    <div class="pt-20">
        <nav class="secondnav">
            <label class="log"><i class="fa-solid fa-database mr-2"></i> DATASETS & PROCESSED TABLES EXPLORER</label>
        </nav>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="glass-card mb-8">
            <h2 class="text-xl font-bold text-white mb-4 font-heading">Select Dataset View</h2>
            <div class="flex flex-wrap gap-3">
                <button class="btn-modern px-5 py-2 text-xs" onclick="kmeans()"><i class="fa-solid fa-table mr-1"></i> K-Means Dataset</button>
                <button class="btn-modern px-5 py-2 text-xs" onclick="linearr()"><i class="fa-solid fa-table mr-1"></i> Linear Regression Dataset</button>
                <button class="btn-modern px-5 py-2 text-xs" onclick="classification()"><i class="fa-solid fa-table mr-1"></i> Classification Dataset</button>
                <button class="btn-modern px-5 py-2 text-xs" onclick="timeseries1()"><i class="fa-solid fa-table mr-1"></i> Time-Series Dataset</button>
                <button class="btn-modern px-5 py-2 text-xs" onclick="analysis()"><i class="fa-solid fa-table mr-1"></i> Plot Data Table</button>
            </div>
        </div>

        <div class="glass-card">
            <h3 class="text-lg font-bold text-white mb-4 font-heading flex items-center justify-between">
                <span><i class="fa-solid fa-list-check text-cyan-400 mr-2"></i> Data Records Inspection Table</span>
            </h3>
            <div class="overflow-x-auto rounded-xl border border-slate-700/50 p-2">
                <div class="table-wrapper text-slate-200" id="csv-data"></div>
            </div>
        </div>
    </main>
</body>

</html>
