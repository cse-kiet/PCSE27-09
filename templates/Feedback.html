<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form | Crime Analytics AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{url_for('static',filename='stylesheets/modern_theme.css')}}">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="main">
        <label class="logo" onclick="window.location.href='{{url_for('index')}}'">
            <i class="fa-solid fa-shield-halved text-purple-400"></i>
            CRIME ANALYTICS AI
        </label>
        <ul>
            <li><a href="{{url_for('index')}}"><i class="fa-solid fa-house mr-1"></i> Home</a></li>
            <li><a href="{{url_for('about')}}"><i class="fa-solid fa-circle-info mr-1"></i> About</a></li>
            <li><a href="{{url_for('feedback')}}" class="active"><i class="fa-solid fa-comment-dots mr-1"></i> Feedback</a></li>
        </ul>
    </nav>
    <div class="pt-20">
        <nav class="secondnav">
            <label class="log"><i class="fa-solid fa-comments mr-2"></i> USER FEEDBACK & SUGGESTIONS FORM</label>
        </nav>
    </div>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6 py-12">
        <div class="glass-card">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-12 h-12 rounded-xl bg-purple-500/20 flex items-center justify-center text-purple-400 text-2xl shrink-0">
                    <i class="fa-solid fa-comment-pen"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-white font-heading">Submit Platform Feedback</h2>
                    <p class="text-slate-400 text-sm">We value your insights to refine our crime forecasting models and dashboard analytics.</p>
                </div>
            </div>

            <!-- Success Alert Box (Hidden by default) -->
            <div id="success-alert" class="hidden mb-6 p-4 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 flex items-center gap-3">
                <i class="fa-solid fa-circle-check text-xl"></i>
                <div>
                    <div class="font-bold text-sm">Thank You for Your Feedback!</div>
                    <div class="text-xs text-emerald-400/90">Your response has been recorded successfully.</div>
                </div>
            </div>

            <form id="feedback-form" onsubmit="handleFeedbackSubmit(event)" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="user-name" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
                            Full Name <span class="text-purple-400">*</span>
                        </label>
                        <input type="text" id="user-name" required placeholder="Enter your full name" class="w-full">
                    </div>
                    <div>
                        <label for="user-email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
                            Email Address <span class="text-purple-400">*</span>
                        </label>
                        <input type="email" id="user-email" required placeholder="name@example.com" class="w-full">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="feedback-category" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
                            Feedback Category
                        </label>
                        <select id="feedback-category" class="w-full">
                            <option value="model-accuracy">Predictive Model Accuracy</option>
                            <option value="ui-design">UI / UX Design & Aesthetics</option>
                            <option value="feature-request">New Feature Request</option>
                            <option value="bug-report">Bug Report</option>
                            <option value="general">General Feedback</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
                            Overall Rating
                        </label>
                        <div class="flex items-center gap-2 pt-2 text-2xl text-amber-400 cursor-pointer" id="star-rating">
                            <i class="fa-solid fa-star transition-transform hover:scale-125" onclick="setRating(1)"></i>
                            <i class="fa-solid fa-star transition-transform hover:scale-125" onclick="setRating(2)"></i>
                            <i class="fa-solid fa-star transition-transform hover:scale-125" onclick="setRating(3)"></i>
                            <i class="fa-solid fa-star transition-transform hover:scale-125" onclick="setRating(4)"></i>
                            <i class="fa-solid fa-star transition-transform hover:scale-125" onclick="setRating(5)"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="feedback-message" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
                        Detailed Message / Suggestions <span class="text-purple-400">*</span>
                    </label>
                    <textarea id="feedback-message" rows="5" required placeholder="Share your experience or suggestions for Crime Analytics AI..." class="w-full"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="btn-modern px-8 py-3 w-full sm:w-auto">
                        <i class="fa-solid fa-paper-plane"></i> Submit Feedback
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        let currentRating = 5;
        function setRating(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('#star-rating i');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.className = 'fa-solid fa-star transition-transform hover:scale-125 text-amber-400';
                } else {
                    star.className = 'fa-regular fa-star transition-transform hover:scale-125 text-slate-600';
                }
            });
        }

        function handleFeedbackSubmit(event) {
            event.preventDefault();
            document.getElementById('success-alert').classList.remove('hidden');
            document.getElementById('feedback-form').reset();
            setRating(5);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>

</html>
