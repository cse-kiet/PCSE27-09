<!DOCTYPE html>
<html lang="en">

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{url_for('static',filename='stylesheets/modern_theme.css')}}">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="main">
        <label class="logo" onclick="window.location.href='{{url_for('index')}}'">

        <ul>
            <li><a href="{{url_for('index')}}"><i class="fa-solid fa-house mr-1"></i> Home</a></li>
